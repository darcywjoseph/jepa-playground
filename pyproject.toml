[project]
name = "jepa-playground"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pyyaml>=6.0.3",
    "av>=18.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 120
extend-exclude = ["reference"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["jepa", "variants"]
ignore_missing_imports = true
disallow_untyped_defs = true 
[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'"
]
